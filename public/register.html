<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SecureDesk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-layout">
    <main class="auth-panel">
        <a class="brand" href="/login.html" aria-label="SecureDesk home">
            <span class="brand-mark">S</span>
            <span>SecureDesk</span>
        </a>

        <div class="auth-content">
            <p class="eyebrow">GET STARTED</p>
            <h1>Create your account.</h1>
            <p class="subtitle">Set up your secure account in less than a minute.</p>

            <form id="registerForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Choose a username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9._\-]*" required>
                </div>
                <div class="input-group">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">
                </div>
                <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>
                <button class="primary-button" type="submit">Create account</button>
            </form>

            <div class="divider"><span>Already registered?</span></div>
            <a href="/login.html" class="secondary-button">Sign in</a>
        </div>

        <p class="footer-text">© 2026 SecureDesk</p>
    </main>

    <aside class="visual-panel" aria-label="SecureDesk security information">
        <div class="visual-card">
            <div class="visual-top"><span class="status-dot"></span><span>Secure by design</span></div>
            <h2>Simple.<br>Private.<br>Secure.</h2>
            <p>Your credentials are protected using modern password hashing and secure authentication.</p>
        </div>
    </aside>
</div>
<script src="js/errors.js" defer></script>
<script src="js/register.js" defer></script>
</body>
</html>
